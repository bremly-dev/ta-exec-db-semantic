# ---------------------------------------------------------------
# Metric Definition — M02
# ---------------------------------------------------------------
metric_id: M02
name: forecasted_attainment_next_eom
display_name: "Forecasted Attainment (Next End of Month)"
business_area: "Hiring Plan & Delivery"
status: draft
version: "1.0"
last_updated: 2026-08-11

definition:
  business: >
    Where offer accepts are projected to stand at the end of the current month if
    the pipeline and current pace continue. A short-horizon forecast leadership can
    sanity-check against the pipeline they already see.
  executive_question: "Are we on pace to hit this month?"

calculation:
  formula: |
    Days Remaining = Last Day of Current Month - Today

    Forecast Offers (Next EOM) =
        Offers Accepted To Date (this month)
      + (Open Reqs x Expected Offer-Accept Probability within Days Remaining)

    Forecasted Attainment % (Next EOM) =
        Forecast Offers (Next EOM) / Planned Offers for Current Month
  measurement_window:
    type: point_in_time
    detail: "Forecast horizon = today through last day of current month. Refreshed and discussed weekly."
    rationale: >
      A short horizon is checkable. Leadership can compare the forecast against the
      pipeline they can see right now, which builds trust in a way a full-year
      projection never does. It is also the only horizon where action this week
      still changes the outcome.
  notes:
    - "Probability must be scoped to days remaining in the month, not a generic full-cycle rate. A req with 35 days typical time-to-accept and 6 days left is unlikely to land THIS month even if very likely to land next month."
    - "Use offer-accept-rate-by-elapsed-time curves per job family. A flat rate will systematically over-forecast late in the month."
    - "Present as a range (conservative / expected) where data supports it. A single point estimate invites false precision."

source:
  primary_table: fct_requisition
  supporting_tables:
    - fct_offer
    - fct_hiring_plan
    - gold_ref_fill_benchmark
  grain: "Evaluated at requisition grain, rolled up to business unit x job family x month"
  key_columns:
    - requisition_id
    - requisition_status
    - current_stage
    - target_hire_date
    - job_family_key
  precomputed_upstream:
    - column: offer_accept_probability_curve
      note: "Historical accept rate by elapsed days, per job family. Governed reference, reviewed by TA leadership."

semantic_model:
  data_type: percentage
  format_string: "0.0%"
  aggregation: non_additive
  default_filters:
    - "requisition_status = 'open'"
  supported_slicers:
    - business_unit
    - job_family
    - critical_role_flag

governance:
  known_pitfalls:
    - "This is the one metric that spans both plan grain and requisition grain. Probabilities are computed per req, then aggregated to meet the plan."
    - "Do not over-engineer the probability model in v1. A transparent, explainable rule beats an accurate black box on an executive page."
    - "Forecast accuracy should itself be tracked — compare prior forecasts against actuals monthly, or the number will quietly lose credibility."
  restatement_risk: medium
  related_metrics: [M01, M03, M06]
